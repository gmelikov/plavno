[package]
name = "plavno"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "A lightweight Linux terminal music player with service waves and library shuffle"
repository = "https://github.com/gmelikov/plavno"
readme = "README.md"
keywords = ["music", "tui", "yandex", "vk", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = ["crates-io"]
include = ["src/**", "tests/*.rs", "tests/fixtures/**", "docs/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "intro.png"]

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
ctr = "0.9"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
dbus = "0.9"
dbus-crossroads = "0.5"
encoding_rs = "0.8"
hmac = "0.12"
html-escape = "0.2"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "mp3", "flac", "mp4", "vorbis"] }
rpassword = "7"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "cookies"] }
url = "2"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
