[package]
name = "plavno"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
description = "A lightweight terminal music player for Linux, macOS and Windows with service waves and library shuffle"
repository = "https://github.com/gmelikov/plavno"
readme = "README.md"
keywords = ["music", "tui", "yandex", "vk", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = ["crates-io"]
include = ["src/**", "tests/*.rs", "tests/support/**", "tests/fixtures/**", "docs/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "intro.png"]

[features]
test-audio = ["objc2/catch-all"]

[dependencies]
anyhow = "1"
plavno-platform = { version = "0.1.0", path = "crates/plavno-platform" }
aes = "0.8"
base64 = "0.22"
ctr = "0.9"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
encoding_rs = "0.8"
hmac = "0.12"
html-escape = "0.2"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "mp3", "flac", "mp4", "vorbis"] }
rpassword = "7"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "isomp4", "ogg", "vorbis"] }
symphonia-metadata = "0.5.5"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "cookies"] }
url = "2"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
dbus-crossroads = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSGeometry", "NSValue", "NSRunLoop", "NSString"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
