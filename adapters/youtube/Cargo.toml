[package]
name = "plavno-youtube"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
libc = "0.2"
rustypipe = { version = "=0.11.4", default-features = false, features = ["rustls-tls-webpki-roots", "userdata"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
