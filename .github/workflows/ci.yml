name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: plavno
            manifest: Cargo.toml
            lockfile: Cargo.lock
          - package: plavno-spotify
            manifest: adapters/spotify/Cargo.toml
            lockfile: adapters/spotify/Cargo.lock
          - package: plavno-youtube
            manifest: adapters/youtube/Cargo.toml
            lockfile: adapters/youtube/Cargo.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.package == 'plavno'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev ffmpeg

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.package }}
          key: ${{ runner.os }}-cargo-${{ matrix.package }}-${{ hashFiles(matrix.lockfile) }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.package }}-

      - name: Check formatting
        run: cargo fmt --manifest-path '${{ matrix.manifest }}' --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path '${{ matrix.manifest }}' --target-dir 'target/${{ matrix.package }}' --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --manifest-path '${{ matrix.manifest }}' --target-dir 'target/${{ matrix.package }}'

      - name: Native stream tests
        if: matrix.package == 'plavno'
        run: cargo test --locked --target-dir target/plavno --test native_stream -- --ignored

      - name: Chrome login protocol test
        if: matrix.package == 'plavno'
        run: cargo test --locked --target-dir target/plavno real_chrome_pipe_supports_http_only_cookies_cancellation_and_cleanup -- --ignored
