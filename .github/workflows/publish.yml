name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the package and Trusted Publishing without uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-plavno
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: crates.io
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/plavno
          key: ${{ runner.os }}-cargo-plavno-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-plavno-

      - name: Validate release ref
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "plavno") | .version')
          git merge-base --is-ancestor HEAD origin/master
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Release tag must match Cargo.toml: v$version" >&2
              exit 1
            fi
          elif [[ "$DRY_RUN" != true ]]; then
            echo "Publishing requires a version tag; branch runs support dry run only" >&2
            exit 1
          fi

      - name: Verify package
        run: cargo publish --locked --dry-run --target-dir target/plavno

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish verified package
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify --target-dir target/plavno
