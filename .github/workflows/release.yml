name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (a matching version tag is required to publish)
        type: string
        default: master
        required: true
      publish:
        description: Publish the archives to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          if [[ "$PUBLISH" == true ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              test "$GITHUB_REF_NAME" = "$tag"
            fi
            git merge-base --is-ancestor HEAD origin/master
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  build:
    name: ${{ matrix.platform }} archive
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64-gnu
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: ubuntu:22.04
          - platform: linux-aarch64-gnu
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: ubuntu:22.04
          - platform: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            container: ''
          - platform: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            container: ''
          - platform: windows-x86_64-msvc
            target: x86_64-pc-windows-msvc
            runner: windows-2025
            container: ''
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.runner == 'windows-2025' && '-C target-feature=+crt-static' || '' }}
    steps:
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config python3 libasound2-dev libdbus-1-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Set up Rust
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/distribution
          key: release-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', 'adapters/*/Cargo.lock') }}
          restore-keys: release-${{ matrix.platform }}-

      - name: Build player and helpers
        run: |
          for manifest in Cargo.toml adapters/spotify/Cargo.toml; do
            cargo build --release --locked --manifest-path "$manifest" --target "$RELEASE_TARGET" --target-dir target/distribution
          done

      - name: Check Linux ABI
        if: runner.os == 'Linux'
        run: |
          for name in plavno plavno-spotify; do
            binary="target/distribution/$RELEASE_TARGET/release/$name"
            ldd "$binary"
            max_glibc=$(readelf --version-info "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)
            if [[ $(printf '%s\n' GLIBC_2.35 "$max_glibc" | sort -V | tail -n 1) != GLIBC_2.35 ]]; then
              echo "$name requires $max_glibc; expected glibc 2.35 or older" >&2
              exit 1
            fi
          done

      - name: Package and test extracted binaries
        run: |
          python3 scripts/package-release.py --version "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM" --binary-dir "target/distribution/$RELEASE_TARGET/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Verify archives and publish if requested
    needs: [validate, check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            cat > dist/release-notes.md <<'EOF'
          Each archive contains plavno, the Spotify helper, README, and license.

          - Linux x86_64 and ARM64: glibc 2.35+, ALSA (`libasound.so.2`), and D-Bus (`libdbus-1.so.3`). Audio through PipeWire/PulseAudio needs an ALSA plugin. Alpine/musl needs a separate build.
          - macOS: Apple Silicon and Intel builds, checked on macOS 15.
          - Windows 10/11 x64: MSVC build with the C runtime linked statically.

          Extract the archive and put both executables in a directory on PATH. Install yt-dlp separately for YouTube and ffmpeg for HLS playback; browser-based service sign-in needs Chrome/Chromium (or Edge on Windows). See README for setup and source builds.

          macOS users can install the player and Spotify helper with `brew install gmelikov/plavno/plavno`. The tap is updated automatically after the release checks pass.
          EOF
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "plavno $RELEASE_TAG" --notes-file dist/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi

  homebrew:
    name: Homebrew
    needs: [validate, release]
    if: ${{ !contains(needs.validate.outputs.version, '-') && !contains(needs.validate.outputs.version, '+') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      run_id: ${{ github.run_id }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
