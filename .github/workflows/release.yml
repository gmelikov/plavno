name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  build:
    name: Linux ${{ matrix.arch }} binary
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git jq pkg-config libasound2-dev libdbus-1-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Validate release tag
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "plavno") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match Cargo.toml: v$version" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/master

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target/release
          key: linux-${{ matrix.arch }}-gnu-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-gnu-release-

      - name: Build and check binary
        run: |
          cargo build --release --locked
          target/release/plavno --help
          ldd target/release/plavno
          max_glibc=$(readelf --version-info target/release/plavno | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)
          if [[ $(printf '%s\n' GLIBC_2.35 "$max_glibc" | sort -V | tail -n 1) != GLIBC_2.35 ]]; then
            echo "Binary requires $max_glibc; expected glibc 2.35 or older" >&2
            exit 1
          fi

      - name: Package binary
        run: |
          archive="plavno-${RELEASE_TAG#v}-linux-$RELEASE_ARCH-gnu.tar.gz"
          mkdir -p dist/package
          cp target/release/plavno LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/$archive" plavno LICENSE README.md
          cd dist
          sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            cat > dist/release-notes.md <<'EOF'
          Linux x86_64 and ARM64 (`aarch64`) binaries, built on Ubuntu 22.04. Require glibc 2.35+, ALSA (`libasound.so.2`), and D-Bus (`libdbus-1.so.3`). Install ffmpeg for HLS playback. Spotify and YouTube helpers are separate builds.

          Extract the archive and run `./plavno`, or install from crates.io with `cargo install plavno --locked`.
          EOF
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "plavno $RELEASE_TAG" --notes-file dist/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
