name: Homebrew

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      run_id:
        description: Release workflow run containing the archives and checksums
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag
        type: string
        required: true
      run_id:
        description: Release workflow run containing the archives and checksums
        type: string
        required: true
      publish:
        description: Update the tap (requires matching public release assets)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  formula:
    name: Generate formula
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Generate formula from verified checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/homebrew-formula.py --tag "$RELEASE_TAG" --checksums dist/SHA256SUMS --output dist/plavno.rb

      - name: Verify published assets before updating the tap
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets > dist/published.json
          python3 - <<'PY'
          import json, os
          release = json.load(open("dist/published.json"))
          if release["isDraft"] or release["isPrerelease"]:
              raise SystemExit("Homebrew requires a public stable release")
          version = os.environ["RELEASE_TAG"][1:]
          required = {f"plavno-{version}-macos-{arch}.tar.gz" for arch in ("aarch64", "x86_64")}
          if not required.issubset({asset["name"] for asset in release["assets"]}):
              raise SystemExit("The release does not contain both macOS archives")
          PY
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir dist/published
          python3 scripts/homebrew-formula.py --tag "$RELEASE_TAG" --checksums dist/published/SHA256SUMS --output dist/published/plavno.rb
          cmp dist/plavno.rb dist/published/plavno.rb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: dist/plavno.rb
          if-no-files-found: error

  test:
    name: Install and test (${{ matrix.os }})
    needs: formula
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: formula

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: archives
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install and test through Homebrew
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/test-homebrew.py --formula formula/plavno.rb --archives archives --tag "$RELEASE_TAG"

  tap:
    name: Update tap or verify publishing access
    needs: [formula, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: homebrew-tap-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gmelikov/homebrew-plavno
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: formula

      - name: Verify publishing access
        if: ${{ !inputs.publish }}
        run: git -C tap push --dry-run origin HEAD

      - name: Update formula without downgrading
        if: inputs.publish
        id: update
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re, shutil
          from pathlib import Path
          destination = Path("tap/Formula/plavno.rb")
          version = tuple(map(int, os.environ["RELEASE_TAG"][1:].split(".")))
          update = True
          if destination.exists():
              match = re.search(r'^  version "([0-9]+\.[0-9]+\.[0-9]+)"$', destination.read_text(), re.M)
              if not match:
                  raise SystemExit("Cannot determine the current tap version")
              update = tuple(map(int, match[1].split("."))) <= version
          if update:
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile("formula/plavno.rb", destination)
          else:
              print("A newer version is already in the tap; skipping")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"update={str(update).lower()}\n")
          PY

      - name: Commit and push formula
        if: inputs.publish && steps.update.outputs.update == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap add Formula/plavno.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap commit -m "Update plavno to $RELEASE_TAG"
            git -C tap push origin HEAD
          fi
