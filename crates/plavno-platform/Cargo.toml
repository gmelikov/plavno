[package]
name = "plavno-platform"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
getrandom = { version = "0.3", features = ["std"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices"] }
